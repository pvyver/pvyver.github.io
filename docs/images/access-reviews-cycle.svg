<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto;">
  <!-- Title -->
  <text x="600" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    Access Reviews: Continuous Compliance Cycle
  </text>
  
  <!-- Central Circle -->
  <circle cx="600" cy="350" r="200" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- Main Flow Cycle -->
  <!-- Phase 1: Schedule -->
  <g>
    <rect x="500" y="100" width="200" height="80" rx="8" fill="#dbeafe" stroke="#0284c7" stroke-width="2"/>
    <text x="600" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#0284c7">
      1. Schedule Review
    </text>
    <text x="600" y="155" font-size="11" text-anchor="middle" fill="#333">
      Define scope, reviewers, timeline
    </text>
    <text x="600" y="170" font-size="10" text-anchor="middle" fill="#666">
      Monthly | Quarterly | Annually
    </text>
  </g>
  
  <!-- Arrow Down -->
  <path d="M 600 180 L 600 210" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Phase 2: Notify -->
  <g>
    <rect x="500" y="210" width="200" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="600" y="240" font-size="14" font-weight="bold" text-anchor="middle" fill="#16a34a">
      2. Notify Reviewers
    </text>
    <text x="600" y="265" font-size="11" text-anchor="middle" fill="#333">
      Email with context, deadline
    </text>
    <text x="600" y="280" font-size="10" text-anchor="middle" fill="#666">
      Managers • Owners • Auditors
    </text>
  </g>
  
  <!-- Arrow Down -->
  <path d="M 600 290 L 600 320" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Phase 3: Review -->
  <g>
    <rect x="500" y="320" width="200" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="600" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#d97706">
      3. Review Access
    </text>
    <text x="600" y="375" font-size="11" text-anchor="middle" fill="#333">
      Evaluate continued need
    </text>
    <text x="600" y="390" font-size="10" text-anchor="middle" fill="#666">
      AI Recommendations • Last Sign-in
    </text>
  </g>
  
  <!-- Arrow Down -->
  <path d="M 600 400 L 600 430" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Phase 4: Decide -->
  <g>
    <rect x="500" y="430" width="200" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="600" y="460" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">
      4. Make Decisions
    </text>
    <text x="600" y="485" font-size="11" text-anchor="middle" fill="#333">
      Approve or Deny Access
    </text>
    <text x="600" y="500" font-size="10" text-anchor="middle" fill="#666">
      Accept Recommendation • Override
    </text>
  </g>
  
  <!-- Arrow Down -->
  <path d="M 600 510 L 600 540" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Phase 5: Apply -->
  <g>
    <rect x="500" y="540" width="200" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="600" y="570" font-size="14" font-weight="bold" text-anchor="middle" fill="#7c3aed">
      5. Apply Results
    </text>
    <text x="600" y="595" font-size="11" text-anchor="middle" fill="#333">
      Auto-remove denied access
    </text>
    <text x="600" y="610" font-size="10" text-anchor="middle" fill="#666">
      Immediate or Scheduled
    </text>
  </g>
  
  <!-- Loop back arrow -->
  <path d="M 700 580 Q 750 350 700 120" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <text x="770" y="350" font-size="11" fill="#666" font-weight="500">
    Recurring Cycle
  </text>
  
  <!-- Left Side: Review Scope Examples -->
  <g>
    <text x="150" y="125" font-size="13" font-weight="bold" fill="#1a1a2e">
      What to Review
    </text>
    
    <rect x="40" y="145" width="220" height="130" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
    <text x="150" y="165" font-size="11" font-weight="bold" text-anchor="middle" fill="#0284c7">
      Groups & Teams
    </text>
    <text x="50" y="185" font-size="10" fill="#333">
      • Microsoft 365 Groups
    </text>
    <text x="50" y="202" font-size="10" fill="#333">
      • Security Groups
    </text>
    <text x="50" y="219" font-size="10" fill="#333">
      • Teams Membership
    </text>
    <text x="50" y="236" font-size="10" fill="#333">
      • Distribution Lists
    </text>
    <text x="50" y="253" font-size="10" fill="#333">
      • Guest Access
    </text>
    <text x="50" y="270" font-size="10" fill="#333">
      • Privileged Groups
    </text>
    
    <rect x="40" y="290" width="220" height="130" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="150" y="310" font-size="11" font-weight="bold" text-anchor="middle" fill="#16a34a">
      Applications
    </text>
    <text x="50" y="330" font-size="10" fill="#333">
      • SaaS Apps
    </text>
    <text x="50" y="347" font-size="10" fill="#333">
      • Enterprise Apps
    </text>
    <text x="50" y="364" font-size="10" fill="#333">
      • Custom Applications
    </text>
    <text x="50" y="381" font-size="10" fill="#333">
      • Admin Roles
    </text>
    <text x="50" y="398" font-size="10" fill="#333">
      • Service Principals
    </text>
    
    <rect x="40" y="435" width="220" height="80" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="150" y="455" font-size="11" font-weight="bold" text-anchor="middle" fill="#d97706">
      Other Resources
    </text>
    <text x="50" y="475" font-size="10" fill="#333">
      • SharePoint Sites
    </text>
    <text x="50" y="492" font-size="10" fill="#333">
      • Access Packages
    </text>
    <text x="50" y="509" font-size="10" fill="#333">
      • Privileged Roles
    </text>
  </g>
  
  <!-- Right Side: Reviewer Experience -->
  <g>
    <text x="1050" y="125" font-size="13" font-weight="bold" fill="#1a1a2e">
      Reviewer Interface
    </text>
    
    <!-- My Access Portal mockup -->
    <rect x="900" y="145" width="280" height="380" rx="6" fill="white" stroke="#999" stroke-width="1" box-shadow="0 2px 8px rgba(0,0,0,0.1)"/>
    
    <!-- Header -->
    <rect x="900" y="145" width="280" height="40" fill="#0284c7"/>
    <text x="1040" y="172" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      My Access Portal
    </text>
    
    <!-- Content -->
    <text x="915" y="210" font-size="10" font-weight="bold" fill="#333">
      Access Reviews
    </text>
    
    <!-- Review Item 1 -->
    <rect x="910" y="220" width="260" height="50" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="915" y="238" font-size="10" font-weight="500" fill="#1a1a2e">
      ✓ Marketing Team Access
    </text>
    <text x="915" y="252" font-size="9" fill="#666">
      4 members | Recommended: Keep
    </text>
    <text x="915" y="263" font-size="9" fill="#666">
      Last Sign-in: 2 days ago
    </text>
    
    <!-- Review Item 2 -->
    <rect x="910" y="280" width="260" height="50" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="915" y="298" font-size="10" font-weight="500" fill="#1a1a2e">
      ⚠ Archive Project Access
    </text>
    <text x="915" y="312" font-size="9" fill="#666">
      2 members | Recommended: Remove
    </text>
    <text x="915" y="323" font-size="9" fill="#666">
      Last Sign-in: 45 days ago
    </text>
    
    <!-- Review Item 3 -->
    <rect x="910" y="340" width="260" height="50" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="915" y="358" font-size="10" font-weight="500" fill="#1a1a2e">
      ➕ New Contractor Access
    </text>
    <text x="915" y="372" font-size="9" fill="#666">
      1 member | Recommended: Review
    </text>
    <text x="915" y="383" font-size="9" fill="#666">
      Justification: External audit
    </text>
    
    <!-- Action Buttons -->
    <rect x="910" y="405" width="80" height="30" rx="4" fill="#16a34a"/>
    <text x="950" y="425" font-size="10" font-weight="bold" text-anchor="middle" fill="white">
      APPROVE
    </text>
    
    <rect x="1000" y="405" width="80" height="30" rx="4" fill="#dc2626"/>
    <text x="1040" y="425" font-size="10" font-weight="bold" text-anchor="middle" fill="white">
      DENY
    </text>
    
    <rect x="1090" y="405" width="80" height="30" rx="4" fill="#999"/>
    <text x="1130" y="425" font-size="10" font-weight="bold" text-anchor="middle" fill="white">
      DEFER
    </text>
    
    <!-- Stats -->
    <text x="915" y="475" font-size="10" font-weight="bold" fill="#333">
      Review Progress
    </text>
    
    <rect x="910" y="485" width="260" height="6" rx="3" fill="#e5e7eb"/>
    <rect x="910" y="485" width="156" height="6" rx="3" fill="#16a34a"/>
    <text x="1040" y="505" font-size="9" text-anchor="middle" fill="#666">
      Completed: 60% (3 of 5 items)
    </text>
  </g>
  
  <!-- Bottom: Key Metrics -->
  <rect x="30" y="600" width="1140" height="70" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  
  <text x="600" y="620" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    Expected Outcomes: Organizations report 40-60% access removal/modification | 50% reduction in security incidents from access review findings
  </text>
  
  <g>
    <text x="150" y="645" font-size="10" fill="#333">
      <tspan font-weight="bold">Time to Complete:</tspan>
      <tspan> 2-4 weeks</tspan>
    </text>
  </g>
  
  <g>
    <text x="420" y="645" font-size="10" fill="#333">
      <tspan font-weight="bold">Compliance Coverage:</tspan>
      <tspan> SOC 2, HIPAA, SOX, PCI-DSS</tspan>
    </text>
  </g>
  
  <g>
    <text x="850" y="645" font-size="10" fill="#333">
      <tspan font-weight="bold">Automation:</tspan>
      <tspan> 100% of decisions applied</tspan>
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#999"/>
    </marker>
  </defs>
</svg>
