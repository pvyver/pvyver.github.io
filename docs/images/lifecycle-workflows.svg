<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto;">
  <!-- Title -->
  <text x="600" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    Lifecycle Workflows: Joiner → Mover → Leaver
  </text>
  
  <!-- JOINER PHASE -->
  <g>
    <!-- Phase Header -->
    <rect x="30" y="70" width="320" height="40" rx="6" fill="#dbeafe" stroke="#0284c7" stroke-width="2"/>
    <text x="190" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="#0284c7">
      JOINER: New Employee
    </text>
    
    <!-- Timeline -->
    <rect x="50" y="140" width="280" height="10" rx="5" fill="#e0e7ff"/>
    <circle cx="70" cy="145" r="6" fill="#6366f1"/>
    <text x="70" y="165" font-size="9" text-anchor="middle" fill="#333">Day -7</text>
    
    <circle cx="160" cy="145" r="6" fill="#6366f1"/>
    <text x="160" y="165" font-size="9" text-anchor="middle" fill="#333">Day 0</text>
    
    <circle cx="250" cy="145" r="6" fill="#6366f1"/>
    <text x="250" y="165" font-size="9" text-anchor="middle" fill="#333">Day +7</text>
    
    <!-- Day -7 Tasks -->
    <rect x="50" y="190" width="100" height="80" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
    <text x="100" y="208" font-size="10" font-weight="bold" text-anchor="middle" fill="#0284c7">Pre-Boarding</text>
    <text x="55" y="225" font-size="9" fill="#333">• Manager email</text>
    <text x="55" y="240" font-size="9" fill="#333">• Equipment order</text>
    <text x="55" y="255" font-size="9" fill="#333">• System prep</text>
    
    <!-- Day 0 Tasks -->
    <rect x="160" y="190" width="100" height="80" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="210" y="208" font-size="10" font-weight="bold" text-anchor="middle" fill="#16a34a">Day 1</text>
    <text x="165" y="225" font-size="9" fill="#333">• Enable account</text>
    <text x="165" y="240" font-size="9" fill="#333">• Groups added</text>
    <text x="165" y="255" font-size="9" fill="#333">• License assigned</text>
    
    <!-- Day +7 Tasks -->
    <rect x="270" y="190" width="100" height="80" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="320" y="208" font-size="10" font-weight="bold" text-anchor="middle" fill="#d97706">Follow-up</text>
    <text x="275" y="225" font-size="9" fill="#333">• Completion check</text>
    <text x="275" y="240" font-size="9" fill="#333">• Manager confirm</text>
    <text x="275" y="255" font-size="9" fill="#333">• Escalate if needed</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 380 280 L 420 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- MOVER PHASE -->
  <g>
    <!-- Phase Header -->
    <rect x="450" y="70" width="320" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="610" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="#16a34a">
      MOVER: Role Change
    </text>
    
    <!-- Change Trigger -->
    <rect x="470" y="140" width="280" height="30" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
    <text x="610" y="162" font-size="11" font-weight="500" text-anchor="middle" fill="#16a34a">
      Attribute Change Detected (e.g., Department: Marketing → Sales)
    </text>
    
    <!-- Workflow Steps -->
    <rect x="470" y="190" width="130" height="80" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="535" y="208" font-size="10" font-weight="bold" text-anchor="middle" fill="#16a34a">Step 1: Revoke</text>
    <text x="475" y="225" font-size="9" fill="#333">• Remove old groups</text>
    <text x="475" y="240" font-size="9" fill="#333">• Revoke app access</text>
    <text x="475" y="255" font-size="9" fill="#333">• Remove licenses</text>
    
    <rect x="620" y="190" width="130" height="80" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="685" y="208" font-size="10" font-weight="bold" text-anchor="middle" fill="#16a34a">Step 2: Grant</text>
    <text x="625" y="225" font-size="9" fill="#333">• Add new groups</text>
    <text x="625" y="240" font-size="9" fill="#333">• Grant app access</text>
    <text x="625" y="255" font-size="9" fill="#333">• Assign licenses</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 900 280 L 940 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- LEAVER PHASE -->
  <g>
    <!-- Phase Header -->
    <rect x="970" y="70" width="200" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="1070" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc2626">
      LEAVER: Exit
    </text>
    
    <!-- Departure Trigger -->
    <rect x="990" y="140" width="160" height="30" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="1070" y="162" font-size="10" font-weight="500" text-anchor="middle" fill="#dc2626">
      Termination Date Reached
    </text>
    
    <!-- Workflow Steps -->
    <rect x="990" y="190" width="160" height="80" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="1070" y="208" font-size="10" font-weight="bold" text-anchor="middle" fill="#dc2626">Immediate Actions</text>
    <text x="995" y="225" font-size="9" fill="#333">• Disable account</text>
    <text x="995" y="240" font-size="9" fill="#333">• Remove all access</text>
    <text x="995" y="255" font-size="9" fill="#333">• Archive data</text>
  </g>
  
  <!-- Bottom section: Key Outcomes -->
  <rect x="30" y="330" width="1140" height="230" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  
  <text x="600" y="360" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    Automated Governance Outcomes
  </text>
  
  <!-- Outcome Cards -->
  <g>
    <!-- Productivity -->
    <rect x="50" y="380" width="260" height="160" rx="6" fill="white" stroke="#0284c7" stroke-width="2"/>
    <text x="180" y="410" font-size="12" font-weight="bold" text-anchor="middle" fill="#0284c7">
      🚀 Productivity
    </text>
    <line x1="60" y1="425" x2="300" y2="425" stroke="#0284c7" stroke-width="1"/>
    <text x="55" y="450" font-size="10" fill="#333">
      ✓ Day-one productivity
    </text>
    <text x="55" y="470" font-size="10" fill="#333">
      ✓ Rapid access to resources
    </text>
    <text x="55" y="490" font-size="10" fill="#333">
      ✓ Seamless role transitions
    </text>
    <text x="55" y="510" font-size="10" fill="#333">
      ✓ Reduced IT overhead
    </text>
    <text x="55" y="530" font-size="10" font-weight="bold" fill="#0284c7">
      Reduces onboarding time by 75%
    </text>
  </g>
  
  <g>
    <!-- Security -->
    <rect x="340" y="380" width="260" height="160" rx="6" fill="white" stroke="#16a34a" stroke-width="2"/>
    <text x="470" y="410" font-size="12" font-weight="bold" text-anchor="middle" fill="#16a34a">
      🔒 Security
    </text>
    <line x1="350" y1="425" x2="590" y2="425" stroke="#16a34a" stroke-width="1"/>
    <text x="345" y="450" font-size="10" fill="#333">
      ✓ Immediate access revocation
    </text>
    <text x="345" y="470" font-size="10" fill="#333">
      ✓ Prevents access creep
    </text>
    <text x="345" y="490" font-size="10" fill="#333">
      ✓ Least-privilege maintained
    </text>
    <text x="345" y="510" font-size="10" fill="#333">
      ✓ Compliance verified
    </text>
    <text x="345" y="530" font-size="10" font-weight="bold" fill="#16a34a">
      Eliminates orphaned accounts
    </text>
  </g>
  
  <g>
    <!-- Compliance -->
    <rect x="630" y="380" width="260" height="160" rx="6" fill="white" stroke="#d97706" stroke-width="2"/>
    <text x="760" y="410" font-size="12" font-weight="bold" text-anchor="middle" fill="#d97706">
      📋 Compliance
    </text>
    <line x1="640" y1="425" x2="880" y2="425" stroke="#d97706" stroke-width="1"/>
    <text x="635" y="450" font-size="10" fill="#333">
      ✓ Complete audit trails
    </text>
    <text x="635" y="470" font-size="10" fill="#333">
      ✓ SOC 2, HIPAA, SOX ready
    </text>
    <text x="635" y="490" font-size="10" fill="#333">
      ✓ Automated reporting
    </text>
    <text x="635" y="510" font-size="10" fill="#333">
      ✓ Regulatory requirements met
    </text>
    <text x="635" y="530" font-size="10" font-weight="bold" fill="#d97706">
      100% audit coverage
    </text>
  </g>
  
  <g>
    <!-- Scale -->
    <rect x="920" y="380" width="250" height="160" rx="6" fill="white" stroke="#ec4899" stroke-width="2"/>
    <text x="1045" y="410" font-size="12" font-weight="bold" text-anchor="middle" fill="#ec4899">
      📈 Scale
    </text>
    <line x1="930" y1="425" x2="1160" y2="425" stroke="#ec4899" stroke-width="1"/>
    <text x="925" y="450" font-size="10" fill="#333">
      ✓ Handles 10k+ users
    </text>
    <text x="925" y="470" font-size="10" fill="#333">
      ✓ No manual intervention
    </text>
    <text x="925" y="490" font-size="10" fill="#333">
      ✓ Cost-effective
    </text>
    <text x="925" y="510" font-size="10" fill="#333">
      ✓ Extensible via Logic Apps
    </text>
    <text x="925" y="530" font-size="10" font-weight="bold" fill="#ec4899">
      Linear cost scaling
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>
