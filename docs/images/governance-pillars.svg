<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto;">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    Identity Governance: Four Pillars Framework
  </text>
  
  <!-- Central Circle -->
  <circle cx="600" cy="450" r="180" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="600" y="450" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#f97316">
    Identity Governance
  </text>
  <text x="600" y="475" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#666">
    Balance Security &amp; Productivity
  </text>
  
  <!-- Pillar 1: Identity Lifecycle (Top-Left) -->
  <rect x="100" y="100" width="220" height="200" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="210" y="130" font-size="16" font-weight="bold" text-anchor="middle" fill="#0284c7">
    1. Identity Lifecycle
  </text>
  <text x="210" y="160" font-size="11" text-anchor="middle" fill="#333" font-weight="500">
    Joiner • Mover • Leaver
  </text>
  <line x1="120" y1="175" x2="300" y2="175" stroke="#0284c7" stroke-width="1"/>
  <text x="115" y="200" font-size="10" fill="#333">
    • HR provisioning
  </text>
  <text x="115" y="220" font-size="10" fill="#333">
    • Lifecycle workflows
  </text>
  <text x="115" y="240" font-size="10" fill="#333">
    • Auto assignment
  </text>
  <text x="115" y="260" font-size="10" fill="#333">
    • Deprovisioning
  </text>
  
  <!-- Pillar 2: Access Lifecycle (Top-Right) -->
  <rect x="880" y="100" width="220" height="200" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="990" y="130" font-size="16" font-weight="bold" text-anchor="middle" fill="#16a34a">
    2. Access Lifecycle
  </text>
  <text x="990" y="160" font-size="11" text-anchor="middle" fill="#333" font-weight="500">
    Request • Review • Revoke
  </text>
  <line x1="900" y1="175" x2="1080" y2="175" stroke="#16a34a" stroke-width="1"/>
  <text x="895" y="200" font-size="10" fill="#333">
    • Access reviews
  </text>
  <text x="895" y="220" font-size="10" fill="#333">
    • Entitlement mgmt
  </text>
  <text x="895" y="240" font-size="10" fill="#333">
    • Conditional Access
  </text>
  <text x="895" y="260" font-size="10" fill="#333">
    • Delegation
  </text>
  
  <!-- Pillar 3: Privileged Access (Bottom-Left) -->
  <rect x="100" y="500" width="220" height="200" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="210" y="530" font-size="16" font-weight="bold" text-anchor="middle" fill="#d97706">
    3. Privileged Access
  </text>
  <text x="210" y="560" font-size="11" text-anchor="middle" fill="#333" font-weight="500">
    JIT • RBAC • PIM
  </text>
  <line x1="120" y1="575" x2="300" y2="575" stroke="#d97706" stroke-width="1"/>
  <text x="115" y="600" font-size="10" fill="#333">
    • Just-in-time access
  </text>
  <text x="115" y="620" font-size="10" fill="#333">
    • Role-based control
  </text>
  <text x="115" y="640" font-size="10" fill="#333">
    • Risk-based policies
  </text>
  <text x="115" y="660" font-size="10" fill="#333">
    • Time-bound access
  </text>
  
  <!-- Pillar 4: Agent Identity (Bottom-Right) -->
  <rect x="880" y="500" width="220" height="200" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="990" y="530" font-size="16" font-weight="bold" text-anchor="middle" fill="#ec4899">
    4. Agent Identity
  </text>
  <text x="990" y="560" font-size="11" text-anchor="middle" fill="#333" font-weight="500">
    AI Agents • Workloads
  </text>
  <line x1="900" y1="575" x2="1080" y2="575" stroke="#ec4899" stroke-width="1"/>
  <text x="895" y="600" font-size="10" fill="#333">
    • Human sponsor
  </text>
  <text x="895" y="620" font-size="10" fill="#333">
    • Identity blueprints
  </text>
  <text x="895" y="640" font-size="10" fill="#333">
    • Time-bound access
  </text>
  <text x="895" y="660" font-size="10" fill="#333">
    • Continuous review
  </text>
  
  <!-- Connecting lines from pillars to center -->
  <line x1="210" y1="300" x2="450" y2="370" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="990" y1="300" x2="750" y2="370" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="210" y1="500" x2="450" y2="530" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="990" y1="500" x2="750" y2="530" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
</svg>
