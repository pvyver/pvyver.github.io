# Site wide configuration
title: Philip Van de Vyver - Cloud & AI
tagline: 'A blog with a focus on Cloud & AI'
description: 'A blog for Philip Van de Vyver with a focus on Cloud and AI containing technical posts regarding Microsoft Azure, AI tools, and modern infrastructure'
url: https://blog.philipvandevyver.com
author: Philip Van de Vyver
date_format: '%B %d, %Y'
fort_awesome_icon: 'cloud'

# Owner configuration
# name and email are required (change code to remove these)
# (leave the rest blank to disable the corresponding sharing button)
owner:
    name: Philip Van de Vyver
    email: philip.vandevyver@2forward.be
    github: pvyver
    twitter: pvyver
    linkedin: philipvandevyver
    facebook:
    google_plus:
    youtube:

# Post sharing icons
sharing:
    twitter: true
    linkedin: true
    facebook: true
    google_plus: true
    reddit: true

# Disqus comments configuration (leave blank to disable comments)
disqus_shortname: 'philipvandevyver'

# Jekyll configuration
permalink: /:year/:month/:day/:title/
paginate: 5

# Markdown
markdown: redcarpet
highlighter: rouge

# Enable when using redcarpet
redcarpet:
  extensions: ['smart', 'tables', 'with_toc_data', 'footnotes']

# Plugins
  - jekyll-paginate
  - jekyll-seo-tag

# Exclude
exclude: ['README.md']
